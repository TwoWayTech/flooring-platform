# Local PostgreSQL 16 for the control database and company databases (blueprint: plain
# PostgreSQL 16+, no provider features). CI runs the same image as a service.
# Start: docker compose up -d   Stop: docker compose stop   Wipe: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
